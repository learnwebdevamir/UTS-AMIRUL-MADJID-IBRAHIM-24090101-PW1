<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pemrograman Web 1</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="main-center-container">
        <div class="login-card-new">
            <div class="card-left-design">
                </div>

            <div class="card-right-form">
                <h1 class="welcome-text">Welcome Back!</h1>
                <p id="error-message" class="error-message"></p>

                <form id="login-form">
                    <div class="input-group-new">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-group-new">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <a href="#" class="forgot-password">Forgot Password?</a>

                    <button type="submit" class="btn btn-login">Login</button>
                </form>

                <div class="or-separator-new">Or</div>

                <div class="social-login-group">
                    <button class="btn btn-social btn-google-new">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="btn btn-social btn-facebook-new">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                </div>

                <p class="signup-text">Don't have an account? <a href="#">Sign Up</a></p>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
