<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pemrograman Web 1</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="product.html"><i class="fas fa-box"></i> Data Produk</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h1>Dashboard</h1>

            <div class="summary-cards">
                <div class="card">
                    <i class="fas fa-shopping-bag card-icon"></i>
                    <p class="card-title">Total Products</p>
                    <p class="card-value" id="totalProducts">0</p>
                </div>
                <div class="card">
                    <i class="fas fa-shopping-cart card-icon"></i>
                    <p class="card-title">Total Sales</p>
                    <p class="card-value" id="totalSales">0</p>
                </div>
                <div class="card">
                    <i class="fas fa-dollar-sign card-icon"></i>
                    <p class="card-title">Total Revenue</p>
                    <p class="card-value" id="totalRevenue">Rp 0</p>
                </div>
            </div>

            <div class="action-section">
                <p>Lihat detail data produk:</p>
                <a href="product.html" class="btn btn-primary">Lihat Data Produk</a>
            </div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
